<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- 4K Ultra-HD Koyu Zümrüt & Obsidyen Radyal Zemin -->
    <radialGradient id="bgRadial4K" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#13382f" />
      <stop offset="45%" stop-color="#09191f" />
      <stop offset="100%" stop-color="#03070b" />
    </radialGradient>

    <!-- 4K Metalik Zümrüt Çerçeve Gradyanı -->
    <linearGradient id="emeraldRim4K" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="30%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#047857" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- 4K 24K Altın Metalik Gradyan -->
    <linearGradient id="goldLux4K" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="28%" stop-color="#fbbf24" />
      <stop offset="62%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Cam Yansıması (Specular Highlight) -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="glow4K" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- En Dış 4K Altın & Zümrüt Halka -->
  <circle cx="120" cy="120" r="116" fill="url(#bgRadial4K)" stroke="url(#emeraldRim4K)" stroke-width="5" />
  <circle cx="120" cy="120" r="109" fill="none" stroke="url(#goldLux4K)" stroke-width="1.5" stroke-opacity="0.75" />

  <!-- Dünya Para Birimleri Sembolleri Kuşağı (12 Saat Yönünde Simetrik Dizilim) -->
  <g font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13.5" text-anchor="middle" dominant-baseline="central">
    <!-- 12:00 - Türk Lirası (₺) -->
    <circle cx="120" cy="22" r="11" fill="#07171e" stroke="url(#goldLux4K)" stroke-width="1.2" />
    <text x="120" y="22.5" fill="#fbbf24">₺</text>

    <!-- 01:00 - Amerikan Doları ($) -->
    <circle cx="169" cy="35" r="10.5" fill="#07171e" stroke="url(#emeraldRim4K)" stroke-width="1.2" />
    <text x="169" y="35.5" fill="#34d399">$</text>

    <!-- 02:00 - Euro (€) -->
    <circle cx="205" cy="71" r="10.5" fill="#07171e" stroke="url(#goldLux4K)" stroke-width="1.2" />
    <text x="205" y="71.5" fill="#fde047">€</text>

    <!-- 03:00 - İngiliz Sterlini (£) -->
    <circle cx="218" cy="120" r="10.5" fill="#07171e" stroke="url(#emeraldRim4K)" stroke-width="1.2" />
    <text x="218" y="120.5" fill="#34d399">£</text>

    <!-- 04:00 - Japon Yeni / Çin Yuanı (¥) -->
    <circle cx="205" cy="169" r="10.5" fill="#07171e" stroke="url(#goldLux4K)" stroke-width="1.2" />
    <text x="205" y="169.5" fill="#fbbf24">¥</text>

    <!-- 05:00 - İsviçre Frangı (₣) -->
    <circle cx="169" cy="205" r="10.5" fill="#07171e" stroke="url(#emeraldRim4K)" stroke-width="1.2" />
    <text x="169" y="205.5" fill="#6ee7b7">₣</text>

    <!-- 06:00 - Bitcoin (₿) -->
    <circle cx="120" cy="218" r="11" fill="#07171e" stroke="url(#goldLux4K)" stroke-width="1.2" />
    <text x="120" y="218.5" fill="#fbbf24">₿</text>

    <!-- 07:00 - Hindistan Rupisi (₹) -->
    <circle cx="71" cy="205" r="10.5" fill="#07171e" stroke="url(#emeraldRim4K)" stroke-width="1.2" />
    <text x="71" y="205.5" fill="#34d399">₹</text>

    <!-- 08:00 - Rus Rublesi (₽) -->
    <circle cx="35" cy="169" r="10.5" fill="#07171e" stroke="url(#goldLux4K)" stroke-width="1.2" />
    <text x="35" y="169.5" fill="#fde047">₽</text>

    <!-- 09:00 - Güney Kore Wonu (₩) -->
    <circle cx="22" cy="120" r="10.5" fill="#07171e" stroke="url(#emeraldRim4K)" stroke-width="1.2" />
    <text x="22" y="120.5" fill="#34d399">₩</text>

    <!-- 10:00 - Suudi Riyali (﷼) -->
    <circle cx="35" cy="71" r="10.5" fill="#07171e" stroke="url(#goldLux4K)" stroke-width="1.2" />
    <text x="35" y="71.5" fill="#fbbf24" font-size="11">﷼</text>

    <!-- 11:00 - Altın Ons/Gram (Au) -->
    <circle cx="71" cy="35" r="10.5" fill="#07171e" stroke="url(#goldLux4K)" stroke-width="1.2" />
    <text x="71" y="35.5" fill="#fde047" font-size="10.5">Au</text>
  </g>

  <!-- İç Kadran Çemberi -->
  <circle cx="120" cy="120" r="84" fill="#050e14" stroke="url(#goldLux4K)" stroke-width="2.2" />
  <circle cx="120" cy="120" r="78" fill="none" stroke="url(#emeraldRim4K)" stroke-width="1" stroke-dasharray="5 3" opacity="0.7" />

  <!-- Arka Plan Finansal Yükseliş Grafiği Silüeti -->
  <path d="M58 148 L88 128 L112 136 L145 102 L178 78" fill="none" stroke="url(#emeraldRim4K)" stroke-width="2.5" stroke-linecap="round" opacity="0.28" />
  <polygon points="178,78 168,80 175,88" fill="#34d399" opacity="0.32" />

  <!-- Üst 4K Cam Parlaması -->
  <ellipse cx="120" cy="78" rx="68" ry="36" fill="url(#glassShine)" />

  <!-- Merkez YEK Monogram Harfleri -->
  <g filter="url(#glow4K)" font-family="'Cinzel', 'Georgia', serif" font-weight="800" text-anchor="middle" dominant-baseline="central">
    <text x="76" y="122" font-size="44" fill="url(#emeraldRim4K)">Y</text>
    <text x="120" y="120" font-size="52" fill="url(#goldLux4K)">E</text>
    <text x="164" y="122" font-size="44" fill="url(#emeraldRim4K)">K</text>
  </g>

  <!-- Alt Kurumsal İmza Bandı -->
  <path d="M82 158 L158 158" stroke="url(#goldLux4K)" stroke-width="1.4" opacity="0.8" />
  <text x="120" y="171" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8.5" letter-spacing="2.5" fill="#94a3b8">GLOBAL FINANCE</text>
</svg>
