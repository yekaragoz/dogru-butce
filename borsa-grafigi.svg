<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" role="img" aria-labelledby="title desc">
  <title id="title">3 boyutlu sanal borsa grafiği</title>
  <desc id="desc">Perspektifli ızgara, hacim sütunları ve dalgalı fiyat çizgisi içeren dekoratif finans grafiği.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163c39" />
      <stop offset=".48" stop-color="#10262b" />
      <stop offset="1" stop-color="#08131d" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".13" />
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".025" />
      <stop offset="1" stop-color="#000000" stop-opacity=".1" />
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity=".37" />
      <stop offset="1" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="trend" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" />
      <stop offset=".65" stop-color="#8df0c4" />
      <stop offset="1" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="barFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37d9a0" />
      <stop offset="1" stop-color="#087c62" />
    </linearGradient>
    <linearGradient id="barSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#075744" />
      <stop offset="1" stop-color="#042d2b" />
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b1ffe0" />
      <stop offset="1" stop-color="#26bd87" />
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-70%" width="180%" height="240%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity=".4" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="8" y="7" width="404" height="146" rx="25" fill="url(#panel)" stroke="#73e8b5" stroke-opacity=".48" stroke-width="1.5" />
    <rect x="10" y="9" width="400" height="142" rx="23" fill="url(#glass)" />
    <path d="M29 10h254c-23 9-51 14-84 14H30Z" fill="#ffffff" fill-opacity=".055" />
    <path d="M11 120 84 151h277l48-28v16a14 14 0 0 1-14 14H31a20 20 0 0 1-20-20Z" fill="#020a10" fill-opacity=".26" />
  </g>

  <g opacity=".62" font-family="Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="1.2" fill="#a6c5c1">
    <text x="29" y="27">YEK · SANAL PİYASA</text>
    <text x="354" y="27" fill="#6be8b0">3D GRAFİK</text>
  </g>

