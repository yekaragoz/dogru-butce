  <path d="m30 91 38-9 28 5 30-21 28 7 30-18 29 7 31-19 26 7 29-16 29 5 34-19" fill="none" stroke="url(#trend)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
